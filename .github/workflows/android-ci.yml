name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Verify committed Gradle Wrapper integrity
        run: |
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict
          grep -F "distributionUrl=https\\://services.gradle.org/distributions/gradle-9.6.0-bin.zip" gradle/wrapper/gradle-wrapper.properties
          grep -F "distributionSha256Sum=bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01" gradle/wrapper/gradle-wrapper.properties

      - name: Verify clean-checkout toolchain
        run: ./gradlew --version

      - name: Snapshot committed Room schemas
        run: |
          mkdir -p /tmp/room-schemas-committed
          cp -a storage/database/schemas/. /tmp/room-schemas-committed/

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Bootstrap generated Room schema
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- storage/database/schemas && \
             [ -z "$(git ls-files --others --exclude-standard storage/database/schemas)" ]; then
            echo "No Room schema changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/database/schemas
          git commit -m "Database: commit generated Room schema"
          git push origin HEAD:${{ github.head_ref }}

      - name: Verify Room schema is committed
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          before_root = Path('/tmp/room-schemas-committed')
          after_root = Path('storage/database/schemas')

          def load(root):
              return {
                  str(path.relative_to(root)): json.loads(path.read_text(encoding='utf-8'))
                  for path in root.rglob('*.json')
              }

          before = load(before_root)
          after = load(after_root)
          if before.keys() != after.keys():
              print('Room schema file set changed. Commit all generated schema files.')
              print('Committed:', sorted(before))
              print('Generated:', sorted(after))
              sys.exit(1)

          changed = [name for name in before if before[name] != after[name]]
          if changed:
              print('Room schema changed semantically. Commit the generated schema before merging:')
              for name in changed:
                  print(' -', name)
              sys.exit(1)

          print('Room schemas match committed structure.')
          PY

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: storage/database/schemas
          if-no-files-found: warn

      - name: Android lint
        run: ./gradlew lint --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify debug APK identity
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -f "$APK"
          "$APKSIGNER" verify "$APK"
          PACKAGE_ID=$("$AAPT2" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          echo "APK package id: $PACKAGE_ID"
          test "$PACKAGE_ID" = "io.github.go0dboy.articlenavigator.dev"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: article-navigator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
